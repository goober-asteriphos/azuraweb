<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sxmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#1e60ff" />
      <stop offset="100%" stop-color="#8000ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b24" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#262b3a" stroke-width="8"/>
  
  <!-- Outer Radio Wave -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" stroke="url(#sxmGrad)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 80 256 A 176 176 0 0 1 432 256" stroke="url(#sxmGrad)" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.2"/>

  <!-- Mid Radio Wave -->
  <path d="M 160 256 A 96 96 0 0 1 352 256" stroke="url(#sxmGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- Core Broadcast Tower / Satellite Arc -->
  <circle cx="256" cy="256" r="38" fill="url(#sxmGrad)"/>
  
  <!-- Dynamic live sound pulse ring -->
  <circle cx="256" cy="256" r="54" stroke="#00e5ff" stroke-width="6" stroke-dasharray="12 12" opacity="0.8"/>
  
  <!-- AzuraCast Wave styling lower waves -->
  <path d="M 150 360 Q 200 320 256 360 T 362 360" stroke="#00e5ff" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M 190 410 Q 225 380 256 410 T 322 410" stroke="#1e60ff" stroke-width="14" stroke-linecap="round" fill="none"/>
</svg>
